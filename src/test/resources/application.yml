spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.chroma.autoconfigure.ChromaVectorStoreAutoConfiguration
  profiles:
    active: test

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:bodeum-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  ai:
    openai:
      api-key: sk-test-not-used

# 테스트 리소스의 application.yml이 main의 것을 통째로 가린다(같은 이름이면 하나만 로딩된다).
# 그래서 main 쪽 기본값과 설정은 여기에도 있어야 한다.
# 아래 management 블록은 src/main/resources/application.yml과 같은 값을 유지할 것.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    redis:
      enabled: ${REDIS_ENABLED:false}

open-api:
  service-key: test-open-api-key

bodeum:
  share:
    base-url: http://localhost:3000
  front:
    callback-url: http://localhost:3000/auth/callback
    allowed-callback-origins:
      - http://localhost:*
  aws:
    s3:
      bucket: test-bucket
      region: ap-northeast-2
      access-key: test-access-key
      secret-key: test-secret-key

openapi:
  secret:
    datago: test-datago-key
    odcloud: test-odcloud-key
    gg: test-gg-key
