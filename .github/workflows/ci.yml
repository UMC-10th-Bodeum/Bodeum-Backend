name: CI

# 배포 이미지는 Dockerfile에서 `bootJar -x test`로 빌드되어 테스트를 건너뛴다.
# 따라서 테스트 게이트는 이 워크플로가 유일하다. main 규칙셋의 필수 체크로 지정할 것.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 같은 브랜치/PR에 새 커밋이 올라오면 이전 검사는 의미가 없으므로 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false # 리포에 push하지 않으므로 토큰 미보존

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 테스트는 H2 인메모리 DB와 더미 키로 동작한다(src/test/resources/application.yml).
      # 외부 리소스나 시크릿에 의존하지 않으므로 별도 서비스 컨테이너가 필요 없다.
      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: always() # 실패했을 때 원인을 봐야 하므로 성공/실패 무관하게 올린다
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
