name: Deploy to EC2

# develop 브랜치에 push되면 이미지를 빌드해 GHCR에 올리고 EC2에서 재기동한다.
on:
  push:
    branches: [develop]
  workflow_dispatch: # 수동 실행도 허용

env:
  # GHCR 경로는 모두 소문자여야 한다 (org: UMC-10th-Bodeum → umc-10th-bodeum)
  IMAGE: ghcr.io/umc-10th-bodeum/bodeum-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR push 권한
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false # 이 워크플로우는 리포에 push하지 않으므로 토큰 미보존

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: meta
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # 자동 배포(SSH)는 develop에 반영됐을 때만. 브랜치에서 수동 실행 시엔 이미지 빌드까지만 수행한다.
    if: github.ref == 'refs/heads/develop'
    permissions:
      packages: read # EC2에서 GHCR pull 시 쓸 GITHUB_TOKEN 권한
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }} # 비어 있으면 기본 22
          # GITHUB_TOKEN은 이 job 실행 동안만 유효하며 GHCR pull 권한이 있다.
          envs: GHCR_USER,GHCR_TOKEN,IMAGE
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd ~/bodeum
            docker compose pull
            docker compose up -d

            # up -d 는 컨테이너를 띄우기만 하고 앱 기동 성공 여부는 보지 않는다.
            # 헬스 체크로 실제 기동을 확인해야 Flyway 검증 실패나 DB 접속 실패가
            # 배포 초록불에 묻히지 않는다.
            # 컨테이너 상시 감시(Dockerfile HEALTHCHECK)는 readiness만 보지만,
            # 배포 직후 1회 검증은 Redis까지 포함한 전체 health로 엄격하게 본다.
            echo "헬스 체크 대기 (최대 150초)"
            HEALTHY=0
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8080/actuator/health > /dev/null 2>&1; then
                echo "앱 기동 확인 ($((i * 5))초)"
                HEALTHY=1
                break
              fi
              sleep 5
            done

            if [ "$HEALTHY" != "1" ]; then
              echo "헬스 체크 실패 - 앱이 기동하지 못했다. 아래 로그로 원인 확인 후 재배포할 것."
              docker compose logs --tail=200 app || true
              docker logout ghcr.io || true
              exit 1
            fi

            docker image prune -f
            docker logout ghcr.io
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.IMAGE }}
