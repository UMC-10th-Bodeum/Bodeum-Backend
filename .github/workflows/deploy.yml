name: Deploy to EC2

# main 브랜치에 push되면 이미지를 빌드해 GHCR에 올리고 EC2에서 재기동한다.
# develop은 기능 통합 브랜치이므로 배포되지 않는다. 운영 반영은 develop → main 배포 PR로만 이뤄진다.
on:
  push:
    branches: [main]
  workflow_dispatch: # 수동 실행도 허용

# 배포는 한 번에 하나만 돈다. main push가 연달아 발생하면 먼저 시작한 실행이 늦게 끝나면서
# 최신 커밋보다 오래된 이미지를 :latest로 덮어쓰고 EC2에 올릴 수 있다.
# 진행 중인 배포는 중간에 끊지 않는다(SSH 도중 취소되면 EC2가 어중간한 상태로 남는다).
# 대기 중인 실행만 최신 것으로 교체된다.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # GHCR 경로는 모두 소문자여야 한다 (org: UMC-10th-Bodeum → umc-10th-bodeum)
  IMAGE: ghcr.io/umc-10th-bodeum/bodeum-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR push 권한
    steps:
      # 과거 실행을 GitHub UI에서 재실행하면 그 시점 커밋으로 다시 빌드된다.
      # 그대로 두면 오래된 이미지가 :latest를 덮어쓰고 운영에 올라간다.
      # main 기준 실행일 때만, 이 실행의 커밋이 현재 main 최신인지 확인한다.
      - name: main 최신 커밋인지 확인
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$HEAD_SHA" != "${{ github.sha }}" ]; then
            echo "이 실행의 커밋(${{ github.sha }})은 main 최신($HEAD_SHA)이 아니다."
            echo "과거 실행을 재실행한 것으로 보인다. 배포하려면 최신 실행을 재실행하거나 main에 새 커밋을 올릴 것."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false # 이 워크플로우는 리포에 push하지 않으므로 토큰 미보존

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: meta
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 빌드 단계에서는 불변인 SHA 태그만 올린다.
          # EC2의 docker-compose.prod.yml이 pull하는 :latest 승격은 아래 단계에서
          # main 최신 여부를 다시 확인한 뒤에만 수행한다.
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 빌드가 도는 몇 분 사이에 main에 새 커밋이 올라올 수 있다. 그대로 두면 늦게 끝난
      # 이전 실행이 오래된 이미지를 :latest로 승격해 운영에 올린다.
      # concurrency는 실행 순서만 정리할 뿐 이 승격을 막지 못하므로 여기서 다시 확인한다.
      # 이미 올라간 SHA 태그는 남으므로, 필요하면 수동 롤백/배포에 그대로 쓸 수 있다.
      - name: main 최신인지 재확인 후 :latest 승격
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$HEAD_SHA" != "${{ github.sha }}" ]; then
            echo "빌드 중 main이 $HEAD_SHA 로 이동했다. 이 실행은 :latest를 승격하지 않는다."
            echo "최신 커밋의 실행이 배포를 이어받는다."
            exit 1
          fi
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:${{ github.sha }}"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # 자동 배포(SSH)는 main에 반영됐을 때만. 다른 브랜치에서 수동 실행 시엔 이미지 빌드까지만 수행한다.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read # main HEAD 재확인용 API 호출 권한
      packages: read # EC2에서 GHCR pull 시 쓸 GITHUB_TOKEN 권한
    steps:
      # build job이 끝나고 이 job이 시작되기까지의 간격에도 main이 움직일 수 있다.
      # SSH 직전에 한 번 더 확인해, 이미 뒤처진 실행이 EC2를 되돌리지 않게 한다.
      - name: main 최신인지 배포 직전 재확인
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$HEAD_SHA" != "${{ github.sha }}" ]; then
            echo "배포 직전 main이 $HEAD_SHA 로 이동했다. 이 실행은 배포하지 않는다."
            exit 1
          fi

      # EC2 SSH 키를 넘기는 서드파티 액션이라 태그가 아닌 commit SHA로 고정한다.
      # 태그는 옮겨 붙을 수 있어, 태그 고정만으로는 공급망 변경을 막지 못한다.
      # 버전을 올릴 때는 GitHub에서 해당 태그의 commit SHA를 다시 확인하고 교체할 것.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }} # 비어 있으면 기본 22
          # 호스트 키 검증. 값이 비어 있으면 검증을 건너뛰므로(액션 기본 동작) 시크릿을
          # 등록하기 전에도 배포는 그대로 동작한다. 등록하면 MITM 서버에 EC2_SSH_KEY와
          # GHCR_TOKEN이 넘어가는 것을 막는다.
          #
          # 값 확인(서버 로그인 불필요, 호스트 키는 공개 정보다):
          #   ssh-keyscan <host> | ssh-keygen -lf -
          # 출력 중 반드시 ECDSA 줄의 SHA256:... 값을 쓴다. 이 액션이 쓰는 drone-ssh는
          # Go x/crypto/ssh 기반이고, 호스트 키 알고리즘 협상에서 ECDSA를 ED25519보다
          # 먼저 고르기 때문이다. OpenSSH는 반대로 ED25519를 먼저 고르므로, ssh로 접속해
          # 뽑은 ed25519 지문을 넣으면 로컬 접속은 멀쩡한데 배포만 handshake에서 끊긴다.
          # (2026-08-07 실제 발생: ssh: handshake failed: host key fingerprint mismatch)
          #
          # EC2를 재생성하면 호스트 키가 바뀌므로 이 시크릿도 함께 갱신해야 한다.
          # 값을 등록/변경한 뒤에는 workflow_dispatch로 배포를 1회 돌려 검증할 것.
          # 검증을 미루면 다음 릴리스 때 다른 사람의 배포가 대신 실패한다.
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          # GITHUB_TOKEN은 이 job 실행 동안만 유효하며 GHCR pull 권한이 있다.
          envs: GHCR_USER,GHCR_TOKEN,IMAGE
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd ~/bodeum
            docker compose pull
            docker compose up -d

            # up -d 는 컨테이너를 띄우기만 하고 앱 기동 성공 여부는 보지 않는다.
            # 헬스 체크로 실제 기동을 확인해야 Flyway 검증 실패나 DB 접속 실패가
            # 배포 초록불에 묻히지 않는다.
            # 컨테이너 상시 감시(Dockerfile HEALTHCHECK)는 readiness만 보지만,
            # 배포 직후 1회 검증은 Redis까지 포함한 전체 health로 엄격하게 본다.
            echo "헬스 체크 대기 (최대 150초)"
            HEALTHY=0
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8080/actuator/health > /dev/null 2>&1; then
                echo "앱 기동 확인 ($((i * 5))초)"
                HEALTHY=1
                break
              fi
              sleep 5
            done

            if [ "$HEALTHY" != "1" ]; then
              echo "헬스 체크 실패 - 앱이 기동하지 못했다. 아래 로그로 원인 확인 후 재배포할 것."
              docker compose logs --tail=200 app || true
              docker logout ghcr.io || true
              exit 1
            fi

            docker image prune -f
            docker logout ghcr.io
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.IMAGE }}
